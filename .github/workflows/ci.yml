name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install
        run: pip install -r server/requirements.txt pytest ruff
      - name: Lint
        run: ruff check --select F,E9,B server
      - name: Test
        working-directory: server
        run: python -m pytest -q
