[project]
name = "ai-usage-insight-server"
version = "0.2.1"
description = "AI 运营洞察平台：把飞书的 AI 用量同步到本地，按人员、部门、应用和场景分析"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "mcp>=2.3",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aius_server"]

[tool.setuptools.package-data]
aius_server = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
